name: Installers
# Builds unsigned installers for macOS, Windows and Linux. Run it from the
# Actions tab, or push a tag like v0.1.0; the files appear as run artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # Also when packaging config changes in a PR, so a broken build shows up before a release.
  pull_request:
    paths: ["package.json", "package-lock.json", "build/**", ".github/workflows/release.yml", "src/electron/**"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: kifu-study-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
