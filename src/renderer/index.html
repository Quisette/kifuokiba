<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>棋譜帖 Kifu Study</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#17120d" />
    <script>
      // Same rule as theme.ts, before any CSS paints, so a light choice never flashes dark.
      try {
        var t = localStorage.getItem("kifu.theme");
        if (t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
